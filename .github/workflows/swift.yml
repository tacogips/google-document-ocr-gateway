name: Swift verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Test library and CLI
        run: swift test
      - name: Verify installed resource lookup
        run: python3 scripts/test-installed-cli.py .build/debug
      - name: Lint Swift
        run: |
          brew list swiftlint || brew install swiftlint
          swiftlint --strict
